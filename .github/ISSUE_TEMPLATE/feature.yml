name: Feature request
description: Suggest an improvement to JEI.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should JEI do? Remember a feature lands on both hosts.
    validations:
      required: true
  - type: dropdown
    id: tab
    attributes:
      label: Which tab
      options: [Files, Search, Symbols, Git, Other]
    validations:
      required: true
