name: Bug report
description: Something in JEI does not work as expected.
labels: [bug]
body:
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Claude Code, OpenCode]
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Host version
      description: Output of the host's version command.
    validations:
      required: true
  - type: input
    id: jei-version
    attributes:
      label: JEI version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Windows Terminal, iTerm2, tmux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets and personal data from logs and screenshots.
          required: true
